[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibl-media"
version = "0.1.0"
description = "Upload IBL media to Google Drive and catalog its provenance on GitHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.16",
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "jsonschema>=4.23",
  "keyring>=25",
  "Pillow>=11",
  "platformdirs>=4.3",
  "PyYAML>=6.0.2",
]

[project.scripts]
ibl-media = "ibl_media.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/ibl_media"]
