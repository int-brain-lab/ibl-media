name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - name: Check fresh installation and private configuration retrieval
        run: uv run --locked python scripts/check_installed_setup.py --wheel
      - name: Validate catalog and keep repository small
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          from ibl_media.metadata import validate_asset
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not name:
                  continue
              path = Path(name)
              if path.stat().st_size > 2_000_000:
                  raise SystemExit(f'File exceeds 2 MB: {name}; store media in Drive.')
              with path.open('rb') as stream:
                  if b'\0' in stream.read(8192):
                      raise SystemExit(f'Binary file in repository: {name}; store media in Drive.')
          for path in Path('assets').glob('*.yaml'):
              entry = yaml.safe_load(path.read_text())
              validate_asset(entry)
              if entry['id'] != path.stem:
                  raise SystemExit(f'Asset ID differs from filename: {path}')
          PY
